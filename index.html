<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Python Editor</title>
  
  <!-- CodeMirror CSS for syntax highlighting & dark theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1f29;
      color: #f8f8f2;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #282a36;
      border-bottom: 1px solid #44475a;
    }
    h1 { font-size: 1.1rem; margin: 0; }
    button {
      background: #50fa7b;
      color: #282a36;
      border: none;
      padding: 8px 18px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:disabled {
      background: #6272a4;
      color: #f8f8f2;
      cursor: not-allowed;
    }
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .pane {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .CodeMirror {
      flex: 1;
      height: 100%;
      font-size: 15px;
    }
    #output {
      flex: 1;
      margin: 0;
      padding: 15px;
      background: #191a21;
      border-left: 1px solid #44475a;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      main { flex-direction: column; }
      .pane { width: 100%; height: 50%; }
      #output { border-left: none; border-top: 1px solid #44475a; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🐍 Python Playground</h1>
    <button id="run-btn" disabled>Loading Python...</button>
  </header>

  <main>
    <div class="pane">
      <textarea id="editor"># Write your Python code here!
import sys

def greet(name):
    return f"Hello, {name}! Running Python {sys.version.split()[0]} in your browser."

print(greet("Coder"))

for i in range(1, 6):
    print(f"Square of {i} is {i**2}")
</textarea>
    </div>
    <div class="pane">
      <pre id="output">Initializing Python environment (takes a few seconds on first load)...</pre>
    </div>
  </main>

  <!-- CodeMirror JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  
  <!-- Pyodide (Python in WebAssembly) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>

  <script>
    const runBtn = document.getElementById("run-btn");
    const outputEl = document.getElementById("output");

    // 1. Initialize CodeMirror editor
    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: "python",
      theme: "dracula",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false
    });

    let pyodide;

    // 2. Load Pyodide and redirect Python print() output to our screen
    async function initPython() {
      try {
        pyodide = await loadPyodide({
          stdout: (text) => { outputEl.textContent += text + "\n"; },
          stderr: (text) => { outputEl.textContent += "[Error] " + text + "\n"; }
        });
        outputEl.textContent = "Ready! Click 'Run Code' to execute.\n";
        runBtn.textContent = "▶ Run Code";
        runBtn.disabled = false;
      } catch (err) {
        outputEl.textContent = "Failed to load Python: " + err;
      }
    }

    // 3. Execute code when button is clicked
    runBtn.addEventListener("click", async () => {
      outputEl.textContent = ""; // Clear previous output
      runBtn.disabled = true;
      runBtn.textContent = "Running...";
      
      try {
        await pyodide.runPythonAsync(editor.getValue());
      } catch (err) {
        outputEl.textContent += err;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "▶ Run Code";
      }
    });

    initPython();
  </script>
</body>
</html>
